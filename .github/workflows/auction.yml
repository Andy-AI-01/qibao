name: update-auction

# 集合竞价专用工作流：独立 concurrency，不被盘中扫描排队拖过 9:31 窗口
on:
  schedule:
    # UTC 01:25 = 北京 09:25
    - cron: '25 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: auction
        run: |
          H=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          echo "beijing now $H"
          if [ "$H" -ge 923 ] && [ "$H" -le 931 ]; then
            python scan_cloud.py --auction
          else
            echo "outside 09:23-09:31, skip"
            exit 0
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          mkdir -p /tmp/keep
          for f in docs/auction.json; do
            [ -f "$f" ] && cp "$f" "/tmp/keep/$(echo $f | tr '/' '_')" || true
          done
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main || true
            git reset --hard origin/main || true
            for f in docs/auction.json; do
              b="/tmp/keep/$(echo $f | tr '/' '_')"
              [ -f "$b" ] && cp "$b" "$f" || true
            done
            git add docs/auction.json 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "与远端无差异，无需推送"
              exit 0
            fi
            git commit -q -m "auction update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) - 重新对齐远端后再试"
            sleep 5
          done
          echo "::error::git push 连续失败 5 次（远端持续有新提交）"
          exit 1
