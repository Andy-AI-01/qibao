name: update-auction

# 集合竞价专用工作流：独立 concurrency，不被盘中扫描排队拖过 9:31 窗口
on:
  schedule:
    # UTC 01:25 = 北京 09:25
    - cron: '25 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auction
  cancel-in-progress: false

jobs:
  auction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: auction
        run: |
          H=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          echo "beijing now $H"
          if [ "$H" -ge 923 ] && [ "$H" -le 931 ]; then
            python scan_cloud.py --auction
          else
            echo "outside 09:23-09:31, skip"
            exit 0
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          if [ ! -s docs/auction.json ]; then
            echo "auction.json 未生成，跳过提交"
            exit 0
          fi
          git add docs/auction.json
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main || true
            git reset --soft origin/main 2>/dev/null || true
            git commit -q -m "auction update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" --allow-empty || true
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) - 远端有新提交，重新对齐后再试"
            sleep 5
          done
          echo "::error::git push 连续失败 5 次（远端一直有新提交）"
          exit 1
          echo "push failed"
          exit 1
