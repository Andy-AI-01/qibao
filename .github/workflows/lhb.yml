name: update-lhb
# 龙虎榜每天收盘后 18:00 左右才披露 -> 每晚 20:00（北京）单独跑一次
# 只拉龙虎榜数据、只 commit lhb.json，不跑全量扫描（约 10 秒）

on:
  schedule:
    # 每晚 20:00 北京 = 12:00 UTC
    - cron: '0 12 * * 1-5'
    # 兜底：22:00 北京 = 14:00 UTC（万一 20:00 那次数据还没出全）
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lhb
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: fetch lhb
        run: |
          echo "beijing time $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          python scan_cloud.py --lhb

      - name: verify
        run: |
          if [ ! -s docs/lhb.json ]; then
            echo "lhb.json 未生成"; exit 1
          fi
          python - <<'EOF'
          import json, io, sys
          d = json.load(io.open('docs/lhb.json', encoding='utf-8'))
          n = len(d.get('rows') or [])
          print('trade_date=%s rows=%d dept=%d' % (
              d.get('trade_date'), n, len(d.get('dept') or [])))
          if n == 0:
              print('今天没有龙虎榜（可能非交易日或还没披露）')
          EOF

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          mkdir -p /tmp/keep
          for f in docs/lhb.json; do
            [ -f "$f" ] && cp "$f" "/tmp/keep/$(echo $f | tr '/' '_')" || true
          done
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main || true
            git reset --hard origin/main || true
            for f in docs/lhb.json; do
              b="/tmp/keep/$(echo $f | tr '/' '_')"
              [ -f "$b" ] && cp "$b" "$f" || true
            done
            git add docs/lhb.json 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "与远端无差异，无需推送"
              exit 0
            fi
            git commit -q -m "lhb update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) - 重新对齐远端后再试"
            sleep 5
          done
          echo "::error::git push 连续失败 5 次（远端持续有新提交）"
          exit 1
