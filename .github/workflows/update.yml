name: update-radar

on:
  schedule:
    # 盘前一次（UTC 00:40 = 北京 08:40），跑出「盘前解读」
    - cron: '40 0 * * 1-5'
    # 注意：09:25 的竞价采集由 auction.yml 独占（独立 concurrency 组，不会被本工作流挡）
    # 09:30 的兜底不需要单独 cron —— 下面 */15 1-6 在 UTC 01:30 必然触发，
    # 且 auction 步骤的 923-931 时间窗会命中，等于天然兜底。（原先多写一条 30 1 会重复跑）
    # 盘中每 15 分钟（UTC 01:00-06:45 = 北京 09:00-14:45）
    - cron: '*/15 1-6 * * 1-5'
    # 收盘瞬间（UTC 07:00 = 北京 15:00），拿当日收盘价
    - cron: '0 7 * * 1-5'
    # 收盘后定稿（UTC 07:35 = 北京 15:35）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: auction
        run: |
          H=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          echo "beijing time $H"
          if [ "$H" -ge 923 ] && [ "$H" -le 931 ]; then
            python scan_cloud.py --auction || echo "auction failed (not fatal)"
          else
            echo "not auction window, skip"
          fi

      - name: scan
        continue-on-error: true
        run: |
          # 先删掉上一次的产物：万一 python 在进异常处理之前就挂了（比如语法错误），
          # 兜底也写不出文件，verify 会因为"文件不存在"而失败，而不是拿旧数据蒙混过关
          rm -f docs/data.json docs/data.js
          echo "=== before ==="
          ls -la
          python scan_cloud.py || echo "scan 返回非 0（已兜底写占位 data.json，不阻断）"
          echo "=== after ==="
          ls -la docs

      - name: verify
        run: |
          if [ ! -s docs/data.json ]; then
            echo "data.json 未生成"
            exit 1
          fi
          echo "OK size=$(wc -c < docs/data.json)"
          if grep -q '"error"' docs/data.json; then
            echo "::warning::data.json 里带 error 字段（抓取不完整或扫描异常），页面会显示红条"
            python -c "import json;d=json.load(open('docs/data.json',encoding='utf-8'));print('trade_date=%s boom=%d error=%s'%(d.get('trade_date'),len(d.get('boom') or []),(d.get('error') or '')[:160]))"
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          mkdir -p /tmp/keep
          for f in docs/data.json docs/data.js docs/auction.json; do
            [ -f "$f" ] && cp "$f" "/tmp/keep/$(echo $f | tr '/' '_')" || true
          done
          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main || true
            git reset --hard origin/main || true
            for f in docs/data.json docs/data.js docs/auction.json; do
              b="/tmp/keep/$(echo $f | tr '/' '_')"
              [ -f "$b" ] && cp "$b" "$f" || true
            done
            git add docs/data.json docs/data.js 2>/dev/null || true
            git add docs/auction.json 2>/dev/null || true
            if git diff --staged --quiet; then
              echo "与远端无差异，无需推送"
              exit 0
            fi
            git commit -q -m "radar update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            if git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected (attempt $i) - 重新对齐远端后再试"
            sleep 5
          done
          echo "::error::git push 连续失败 5 次（远端持续有新提交）"
          exit 1
