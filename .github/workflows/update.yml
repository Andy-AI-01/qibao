name: update-radar

on:
  schedule:
    # 盘中每 15 分钟（UTC 01:00-06:45 = 北京 09:00-14:45）
    - cron: '*/15 1-6 * * 1-5'
    # 收盘后定稿（UTC 07:35 = 北京 15:35）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: scan
        run: |
          echo "=== before ==="
          ls -la
          python scan_cloud.py
          echo "=== after ==="
          ls -la docs

      - name: verify
        run: |
          if [ -s docs/data.json ]; then
            echo "OK size=$(wc -c < docs/data.json)"
          else
            echo "data.json 未生成"
            exit 1
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "radar update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
