name: update-radar

on:
  schedule:
    # 盘前一次（UTC 00:40 = 北京 08:40），跑出「盘前解读」
    - cron: '40 0 * * 1-5'
    # 集合竞价（UTC 01:25 = 北京 09:25），采集竞价三判
    - cron: '25 1 * * 1-5'
    # 竞价兜底（UTC 01:30 = 北京 09:30）
    - cron: '30 1 * * 1-5'
    # 盘中每 15 分钟（UTC 01:00-06:45 = 北京 09:00-14:45）
    - cron: '*/15 1-6 * * 1-5'
    # 收盘后定稿（UTC 07:35 = 北京 15:35）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: auction
        run: |
          H=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          echo "beijing time $H"
          if [ "$H" -ge 923 ] && [ "$H" -le 931 ]; then
            python scan_cloud.py --auction || echo "auction failed (not fatal)"
          else
            echo "not auction window, skip"
          fi

      - name: scan
        run: |
          echo "=== before ==="
          ls -la
          python scan_cloud.py
          echo "=== after ==="
          ls -la docs

      - name: verify
        run: |
          if [ -s docs/data.json ]; then
            echo "OK size=$(wc -c < docs/data.json)"
          else
            echo "data.json 未生成"
            exit 1
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "radar update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
