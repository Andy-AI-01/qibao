name: update-radar

on:
  schedule:
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: scan
        run: |
          echo "=== 扫描前 ==="
          ls -la
          python scan_cloud.py
          echo "=== 扫描后 docs ==="
          ls -la docs

      - name: verify
        run: |
          if [ -s docs/data.json ]; then
            echo "OK size=$(wc -c < docs/data.json)"
          else
            echo "data.json 未生成"
            exit 1
          fi

      - name: commit
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "radar update $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi
